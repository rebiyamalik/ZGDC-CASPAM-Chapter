<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="ZGDC–CASPAM Chapter. Build. Learn. Ship together.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#fff8e6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4"/><stop offset=".33" stop-color="#EA4335"/>
      <stop offset=".66" stop-color="#FBBC05"/><stop offset="1" stop-color="#34A853"/>
    </linearGradient>
    <clipPath id="reveal"><rect x="80" y="205" width="0" height="50">
      <animate attributeName="width" from="0" to="760" dur="1.8s" begin="0.4s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- soft drifting blobs -->
  <circle cx="160" cy="70" r="120" fill="#4285F4" opacity=".10"><animate attributeName="cx" values="160;230;160" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="300" r="140" fill="#EA4335" opacity=".08"><animate attributeName="cy" values="300;250;300" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="60" r="90" fill="#FBBC05" opacity=".16"><animate attributeName="cx" values="980;920;980" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="330" r="100" fill="#34A853" opacity=".10"><animate attributeName="cx" values="520;600;520" dur="10s" repeatCount="indefinite"/></circle>

  <!-- floating cubes (isometric) -->
  <g>
    <g transform="translate(930 110)"><animateTransform attributeName="transform" type="translate" values="930 110;930 90;930 110" dur="4s" repeatCount="indefinite"/>
      <polygon points="0,-34 30,-17 0,0 -30,-17" fill="#6aa0f8"/><polygon points="-30,-17 0,0 0,36 -30,19" fill="#3b78e0"/><polygon points="30,-17 0,0 0,36 30,19" fill="#2c5fc0"/></g>
    <g transform="translate(1060 200)"><animateTransform attributeName="transform" type="translate" values="1060 200;1060 178;1060 200" dur="5s" repeatCount="indefinite"/>
      <polygon points="0,-26 23,-13 0,0 -23,-13" fill="#ff7a6b"/><polygon points="-23,-13 0,0 0,28 -23,15" fill="#ea4335"/><polygon points="23,-13 0,0 0,28 23,15" fill="#c5322a"/></g>
    <g transform="translate(850 255)"><animateTransform attributeName="transform" type="translate" values="850 255;850 235;850 255" dur="3.6s" repeatCount="indefinite"/>
      <polygon points="0,-20 18,-10 0,0 -18,-10" fill="#ffd54a"/><polygon points="-18,-10 0,0 0,22 -18,12" fill="#fbbc05"/><polygon points="18,-10 0,0 0,22 18,12" fill="#d49b00"/></g>
    <g transform="translate(1110 90)"><animateTransform attributeName="transform" type="translate" values="1110 90;1110 74;1110 90" dur="4.4s" repeatCount="indefinite"/>
      <polygon points="0,-16 14,-8 0,0 -14,-8" fill="#4fcf86"/><polygon points="-14,-8 0,0 0,17 -14,9" fill="#34a853"/><polygon points="14,-8 0,0 0,17 14,9" fill="#25883f"/></g>
  </g>

  <!-- code brackets -->
  <g font-family="Sora, 'Segoe UI', Arial, sans-serif" font-weight="800">
    <text x="80" y="120" font-size="46" fill="#4285F4"><tspan>&lt;</tspan><tspan fill="#EA4335">/</tspan><tspan fill="#34A853">&gt;</tspan>
      <animate attributeName="opacity" values="0;1" dur=".8s" fill="freeze"/></text>
    <text x="80" y="195" font-size="60" fill="#14171f" letter-spacing="-2">ZGDC<tspan fill="#4285F4">–CASPAM</tspan>
      <animate attributeName="opacity" values="0;1" dur=".9s" begin=".1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur=".9s" begin=".1s" fill="freeze"/></text>
    <g clip-path="url(#reveal)"><text x="80" y="245" font-size="30" font-weight="600" fill="#565d6b">Build. Learn. <tspan fill="#EA4335">Ship</tspan> together.</text></g>
  </g>
  <text x="80" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#565d6b" opacity="0">Zakariyan Google Developer Club · BZU Multan
    <animate attributeName="opacity" values="0;1" dur=".8s" begin="2s" fill="freeze"/></text>

  <!-- colour bar that sweeps along the bottom -->
  <rect x="0" y="348" width="1200" height="12" fill="url(#bar)"/>
  <rect x="-300" y="348" width="300" height="12" fill="#fff" opacity=".55"><animate attributeName="x" values="-300;1200" dur="3.2s" repeatCount="indefinite"/></rect>
</svg>
